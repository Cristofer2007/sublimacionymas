<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto</title>
  <link rel="stylesheet" href="estilos2.css" />
</head>
<body>

  <div class="contacto-container">
    <h1>Contáctanos</h1>
    <p>¿Tienes dudas, deseas realizar un pedido o una cotización personalizada? ¡Escríbenos!</p>

    <form class="formulario-contacto">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required />

      <label for="asunto">Asunto</label>
      <input type="text" id="asunto" name="asunto" required />

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>

    <div class="info-contacto">
      <h2>También puedes encontrarnos en:</h2>
      <ul>
        <li>📧 Email: sublimacionymas@gmail.com</li>
        <li>📞 Teléfono: +504 92576212</li>
        <li>📍 Dirección: Barrio Miraflores, La Entrada Copan</li>
      </ul>
      <div class="redes-sociales">
        <a href="https://www.facebook.com/" title="Facebook">🌐 Facebook</a>
        <a href="https://www.instagram.com/" title="Instagram">📸 Instagram</a>
        <a href="https://www.whatsapp.com/" title="WhatsApp">💬 WhatsApp</a>
      </div>

      <!-- Mapa de Google Maps -->
      <div class="mapa">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d123294.71200039273!2d-88.75540480000001!3d15.0503424!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2shn!4v1745368376521!5m2!1sen!2shn" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </iframe>
      </div>
    </div>

  </div>

</body>
</html>
